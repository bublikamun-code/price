$kind: http-request
name: PATCH Update Me
method: PATCH
url: '{{base_url}}/api/v1/auth/me'
order: 5000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "display_currency": "USD",
      "price_digest_enabled": true,
      "price_digest_sources": ["cart", "favorite", "orders"]
    }
