$kind: http-request
name: PATCH Update Order Status
method: PATCH
url: '{{base_url}}/api/v1/manager/orders/{{order_id}}'
order: 3000
pathVariables:
  - key: order_id
    value: ''
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "status": "IN_PROGRESS",
      "manager_id": null
    }
