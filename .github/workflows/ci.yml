# CI: тесты API + защита от дрейфа моделей → миграций + typecheck веба.
# Появилось по аудиту 2026-09-06 (§3: дрейф миграций собрал 0007; §8 п.15).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API tests + alembic check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: price
          POSTGRES_PASSWORD: price_ci
          POSTGRES_DB: price_portal
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U price"
          --health-interval 5s --health-timeout 5s --health-retries 10
      # Тесты кэша и rate-limit ходят в настоящий Redis: conftest подменяет
      # только event-loop клиента кэша, а не сам сервер. Без этого сервиса
      # job падал с ConnectionError на test_login_rate_limit и dashboard-ках.
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DB_URL: postgresql+asyncpg://price:price_ci@localhost:5432/price_portal_test
      DATABASE_URL: postgresql+asyncpg://price:price_ci@localhost:5432/price_portal
      ENV: dev
      SECRET_KEY: ci-test-secret-key-for-fastapi-tests-2026
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: price
      POSTGRES_PASSWORD: price_ci
      POSTGRES_DB: price_portal
      S3_ENDPOINT: http://minio:9000
      S3_EXTERNAL_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - name: Install deps
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Prepare test DB
        run: |
          PGPASSWORD=price_ci psql -h localhost -U price -d price_portal \
            -c 'CREATE DATABASE price_portal_test'
      # Дрейф моделей → миграций: check падает, если модели разошлись с миграциями
      - name: alembic check (drift guard)
        working-directory: apps/api
        run: |
          alembic upgrade head
          alembic check
      - name: Pytest
        working-directory: apps/api
        run: pytest -q
      - name: API v2 semantic compatibility
        if: github.event_name == 'pull_request'
        working-directory: apps/api
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          BASE_CONTRACT="apps/api/tests/fixtures/openapi/api-v2.openapi.json"
          if git cat-file -e "$BASE_REF:$BASE_CONTRACT"; then
            git show "$BASE_REF:$BASE_CONTRACT" > /tmp/api-v2-base.openapi.json
            python -m app.scripts.check_v2_semantics \
              /tmp/api-v2-base.openapi.json \
              "$BASE_CONTRACT"
          else
            echo "No API v2 OpenAPI baseline on $BASE_REF; seeding the first contract snapshot."
          fi

  web:
    name: Web typecheck + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install deps
        working-directory: apps/web
        run: npm ci
      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Unit tests
        working-directory: apps/web
        run: npm test
