# CI: тесты API + защита от дрейфа моделей → миграций + typecheck веба.
# Появилось по аудиту 2026-09-06 (§3: дрейф миграций собрал 0007; §8 п.15).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API tests + alembic check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: price
          POSTGRES_PASSWORD: price_ci
          POSTGRES_DB: price_portal
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U price"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DB_URL: postgresql+asyncpg://price:price_ci@localhost:5432/price_portal_test
      DATABASE_URL: postgresql+asyncpg://price:price_ci@localhost:5432/price_portal
      ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - name: Install deps
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Prepare test DB
        run: |
          PGPASSWORD=price_ci psql -h localhost -U price -d price_portal \
            -c 'CREATE DATABASE price_portal_test'
      # Дрейф моделей → миграций: check падает, если модели разошлись с миграциями
      - name: alembic check (drift guard)
        working-directory: apps/api
        run: |
          alembic upgrade head
          alembic check
      - name: Pytest
        working-directory: apps/api
        run: pytest -q

  web:
    name: Web typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install deps
        working-directory: apps/web
        run: npm ci
      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck
