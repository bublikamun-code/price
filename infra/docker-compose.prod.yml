# ============================================================
#  docker-compose PROD override
#  Применение: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#  Отличия от dev:
#    - нет монтирования исходников (код внутри образа)
#    - api запускается через gunicorn+uvicorn-workers
#    - web отдаёт собранный .output (Nitro), без dev-сервера
#    - nginx на 80/443 с TLS (сертификаты монтируются извне)
#    - db/redis/minio не публикуют порты наружу (только внутренняя сеть)
#    - рестарты always
# ============================================================

services:
  # ---------- Prod-харднинг (§16 п.24): порты только внутренние ----------
  db:
    ports: !reset []            # наружу только через nginx (в dev — 5432)

  redis:
    ports: !reset []            # в dev — 6379

  minio:
    ports: !reset []            # в dev — 9000/9001

  api:
    build:
      target: runtime
    env_file: ../.env
    environment:
      JWT_ALGORITHM: RS256                        # prod: RS256 + PEM-ключи (§16 п.15)
      JWT_PRIVATE_KEY_PATH: /jwt-keys/jwt_rsa.key
      JWT_PUBLIC_KEY_PATH: /jwt-keys/jwt_rsa.pub
      COOKIE_SECURE: true                         # prod: Secure-куки только по HTTPS (§16 п.30)
    # X-Forwarded-For от nginx обязателен: без него slowapi видит IP самого
    # nginx, и пер-IP лимиты login (5/15min) становятся глобальными. Доверять
    # всем адресам безопасно — наружу api не публикуется (ports: !reset ниже).
    command: >
      gunicorn app.main:app
      --worker-class uvicorn.workers.UvicornWorker
      --workers 4 --bind 0.0.0.0:8000
      --timeout 120 --graceful-timeout 30
      --proxy-headers --forwarded-allow-ips=*
    volumes: !override            # код внутри образа; только JWT-ключи read-only
      - ./jwt-keys:/jwt-keys:ro   # = infra/jwt-keys (make gen-jwt-keys)
    restart: always
    ports: !reset []           # наружу только через nginx

  worker:
    build:
      target: runtime
    volumes: !override []        # код внутри образа (без !override volume из dev остаётся)
    restart: always
    command: celery -A app.workers.celery_app worker -l info --concurrency=4

  beat:
    build:
      target: runtime
    volumes: !override []
    restart: always

  # ---------- Telegram-бот ----------
  # Возвращён 2026-09-06 вместе с реализацией long-polling бота
  # (apps/api/app/bot/__main__.py).
  # bot:
  #   build:
  #     target: runtime
  #   volumes: !override []
  #   restart: always

  web:
    build:
      target: runtime
    volumes: !override []
    ports: !reset []            # наружу только через nginx (в dev — 3000)
    restart: always
    command: ["node", ".output/server/index.mjs"]

  nginx:
    ports: !override            # !override: иначе к 80/443 добавится 8080 из dev-файла
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro   # self-contained prod-конфиг (§16 п.24)
      - ./nginx/certs:/etc/nginx/certs:ro                  # fullchain.pem + privkey.pem (make gen-self-signed-certs / Let's Encrypt)
    restart: always
