# Nginx — единый вход (reverse proxy для api + web), PROD.
#
# Отдельный self-contained конфиг (docker-compose.prod.yml подключает его
# вместо dev-конфига). Отличия от infra/nginx/nginx.conf:
#   - 80 редиректит на 443, TLS из /etc/nginx/certs (смонтированы в compose)
#   - /docs и /openapi.json закрыты (в dev открыты для разработки)
#   - /metrics только из внутренних сетей
#   - Permissions-Policy и HSTS; CSP не здесь — её ставит Nitro-приложение
#     (nonce per-request, DEC-02), см. комментарий у upstream web_upstream
#
# Публикация под префиксом /price (Tailscale Funnel path-handler, §16 п.46):
#   обработчик пути /price срезает префикс — запрос
#   https://<host>/price/catalog приходит сюда как GET /catalog, а
#   /price/api/v1/... — как GET /api/v1/.... Приложение же собрано с
#   app.baseURL='/price' и ждёт пути С префиксом, поэтому:
#   * API-пути уходят в api как есть (префикс снят);
#   * страницы приложения получают базу /price обратно (rewrite в location /).
#   Прямой доступ по полному пути (/price/...) с LAN или с самого сервера
#   обрабатывается блоками ^~ /price/... — там префикс уже есть.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 100M;        # загрузка CSV/ZIP до 100МБ

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Логирование
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" rt=$request_time '
                    'xfp="$http_x_forwarded_proto" xff="$http_x_forwarded_for" scheme="$scheme"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    upstream api_upstream {
        server api:8000;
        keepalive 32;
    }

    upstream web_upstream {
        server web:3000;
        keepalive 32;
    }

    # Протокол внешней стороны клиента. За nginx стоит Tailscale Funnel,
    # который приходит по HTTPS и присылает X-Forwarded-Proto: https; если
    # проксировать $scheme, схема станет http, и API/приложение решат, что
    # клиент пришёл без HTTPS (Secure-куки, редиректы, CSP). Пусто → $scheme.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    # Реальный IP клиента для rate-limit'ов и логов API.
    #   * через Tailscale Funnel приходит X-Forwarded-For с настоящим IP
    #     клиента — Funnel перезаписывает клиентские подделки, поэтому
    #     цепочке можно верить;
    #   * при прямом обращении (LAN, сам сервер) заголовка нет — берём
    #     IP соединения.
    # В API уходит ровно один адрес, и uvicorn берёт его из цепочки
    # (--forwarded-allow-ips=*): иначе все публичные клиенты делили бы
    # один счётчик логина (5 попыток / 15 мин на весь интернет).
    map $http_x_forwarded_for $client_ip {
        ''      $remote_addr;
        default $http_x_forwarded_for;
    }

    server {
        listen 80;
        server_name _;
        # ACME-челлендж (если сертификаты продлеваются через webroot) должен
        # остаться на HTTP, остальное уводим на TLS.
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        # healthcheck контейнера nginx ходит по http://127.0.0.1/healthz —
        # без этого блока он уходил бы в 308 на https://$host/... и падал
        # (самоподписанный/чуждой сертификат), помечая контейнер unhealthy.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
        location / {
            return 308 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # HSTS на год: здесь TLS терминируется этим nginx, а не auto-SSL
        # хостера, поэтому риска «сертификат хостера протух и сайт заблокирован»
        # нет. На боевом хостинге (PM2 за edge) max-age намеренно короче —
        # см. security-headers.ts.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;

        # --- API ---
        # SSE-стрим уведомлений: до /api/, без буферизации и кэша, долгий
        # read-timeout; proxy_set_header — в стиле location /api/.
        location ^~ /api/v1/notifications/stream {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        location /api/ {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Connection "";
            proxy_read_timeout 120s;
        }

        # --- Swagger/OpenAPI: в прод не публикуются ---
        location /docs { return 404; }
        location /openapi.json { return 404; }
        location /redoc { return 404; }

        # Готовность API для healthcheck; наружу не публикуем.
        location /readyz { return 404; }

        # /healthz отдаёт сам nginx статикой (200 "ok"): healthcheck контейнера
        # nginx не зависит от api и переживает его рестарты.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # --- Prometheus-метрики API: только из внутренней docker-сети ---
        # Второй слой защиты: само приложение в prod тоже требует
        # X-Metrics-Token (METRICS_TOKEN в .env) либо отвечает 404.
        location /metrics {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            proxy_pass http://api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # --- Публикация под префиксом /price (Tailscale Funnel path) ---
        # Прямой доступ по полному пути (/price/...) с LAN или с самого сервера:
        # префикс уже есть, у API-путей он снимается, страницы идут как есть.
        location ^~ /price/api/v1/notifications/stream {
            rewrite ^/price(/api/.*)$ $1 break;
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        location ^~ /price/api/ {
            rewrite ^/price(/api/.*)$ $1 break;
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Connection "";
            proxy_read_timeout 120s;
        }

        location ^~ /price/ {
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header X-Request-ID $request_id always;

            proxy_pass http://web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # --- Frontend (Nuxt SSR) ---
        # Заголовки дублируются на уровне location: add_header внутри location
        # не наследует add_header уровня server, а задаёт свой полный набор.
        # CSP шлёт само приложение (nonce per-request) — см. комментарий вверху.
        location / {
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header X-Request-ID $request_id always;

            # Приложение живёт под базой /price. Путь от Funnel приходит без
            # префикса (Funnel его срезает) — добавляем базу, иначе Nitro не
            # найдёт маршрут. Уже готовые /price/... не трогаем.
            rewrite ^/(?!price(?:/|$))(.*)$ /price/$1 break;

            proxy_pass http://web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
