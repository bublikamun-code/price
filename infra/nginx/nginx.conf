# Nginx — единый вход (reverse proxy для api + web)
# DEV: слушает 8080. PROD: 80/443 + TLS (см. docker-compose.prod.yml).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 100M;        # загрузка CSV/ZIP до 100МБ

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Логирование
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    upstream api_upstream {
        server api:8000;
        keepalive 32;
    }

    upstream web_upstream {
        server web:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # --- API ---
        location /api/ {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 120s;
        }

        # --- Swagger/OpenAPI ---
        location /docs { proxy_pass http://api_upstream; proxy_set_header Host $host; }
        location /openapi.json { proxy_pass http://api_upstream; proxy_set_header Host $host; }
        location /healthz { proxy_pass http://api_upstream; proxy_set_header Host $host; }
        location /readyz { proxy_pass http://api_upstream; proxy_set_header Host $host; }

        # --- Frontend (Nuxt SSR) ---
        location / {
            proxy_pass http://web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
