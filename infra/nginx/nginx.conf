# Nginx — единый вход (reverse proxy для api + web)
# DEV: слушает 8080. PROD: 80/443 + TLS (см. docker-compose.prod.yml).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 100M;        # загрузка CSV/ZIP до 100МБ

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Логирование
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" rt=$request_time '
                    'xfp="$http_x_forwarded_proto" scheme="$scheme"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    upstream api_upstream {
        server api:8000;
        keepalive 32;
    }

    upstream web_upstream {
        server web:3000;
        keepalive 32;
    }

    # Протокол внешней стороны клиента. За nginx стоит Tailscale Funnel,
    # который приходит по HTTPS и присылает X-Forwarded-Proto: https; если
    # проксировать $scheme, схема станет http, и API/приложение решат, что
    # клиент пришёл без HTTPS (Secure-куки, редиректы, CSP). Пусто → $scheme.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    server {
        listen 80;
        server_name _;

        # --- API ---
        # SSE-стрим уведомлений (§16 п.26): до /api/, без буферизации и кэша,
        # долгий read-timeout; proxy_set_header — в стиле location /api/.
        location ^~ /api/v1/notifications/stream {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        location /api/ {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Connection "";
            proxy_read_timeout 120s;
        }

        # --- Swagger/OpenAPI ---
        location /docs { proxy_pass http://api_upstream; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
        location /openapi.json { proxy_pass http://api_upstream; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
        location /readyz { proxy_pass http://api_upstream; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }

        # /healthz отдаёт сам nginx статикой (200 "ok"): healthcheck контейнера nginx
        # не зависит от api и переживает его рестарты. Реальный health API — /readyz выше.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # --- Prometheus-метрики API (§12, §16 п.23) ---
        # DEV: открыт для локального Prometheus. В prod ограничить доступ (allow/deny, Этап 11).
        # Метрики Prometheus — только внутренние сети (аудит 2026-09-06: наружу открыт)
        location /metrics {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            proxy_pass http://api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # --- Публикация под префиксом /price (Tailscale Funnel path) ---
        # ВАЖНО, как работает Funnel: обработчик пути /price срезает префикс —
        # запрос https://<host>/price/catalog приходит сюда как GET /catalog,
        # а /price/api/v1/... — как GET /api/v1/.... Поэтому:
        #   * API-пути приходят без префикса и уходят в api как есть;
        #   * страницы приложения приходят без префикса, а Nuxt собран с
        #     app.baseURL='/price' и ждёт пути С префиксом — значит префикс
        #     добавляется перед проксированием (location / ниже).
        # Прямой доступ по полному пути (/price/...) с LAN или с самого сервера
        # обрабатывается отдельными блоками ниже — там префикс уже есть.
        location ^~ /price/api/v1/notifications/stream {
            rewrite ^/price(/api/.*)$ $1 break;
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        location ^~ /price/api/ {
            rewrite ^/price(/api/.*)$ $1 break;
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Connection "";
            proxy_read_timeout 120s;
        }

        location ^~ /price/ {
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Request-ID $request_id always;
            add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: blob: http://localhost:9000; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru; connect-src 'self' https://mc.yandex.ru" always;

            proxy_pass http://web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # --- Frontend (Nuxt SSR) ---
        location / {
            # Security-заголовки web-корня (аудит 2026-09-18 №6). X-Frame-Options
            # здесь НЕ дублируем: Nuxt SSR ставит DENY сам (аудит 25.10 — два
            # владельца давали пару DENY+SAMEORIGIN; запрет фреймов остаётся
            # в force-режиме через CSP frame-ancestors 'none').
            # CSP в Report-Only (§16 п.30: enforcing после анализа отчётов),
            # чтобы не сломать инлайн-стили Nuxt и картинки MinIO до анализа.
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Request-ID $request_id always;
            add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: blob: http://localhost:9000; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru; connect-src 'self' https://mc.yandex.ru" always;

            # Приложение живёт под базой /price. Путь от Funnel приходит без
            # префикса (Funnel его срезает) — добавляем базу, иначе Nitro не
            # найдёт маршрут. Уже готовые /price/... не трогаем.
            rewrite ^/(?!price(?:/|$))(.*)$ /price/$1 break;

            proxy_pass http://web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
