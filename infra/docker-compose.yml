# ============================================================
#  docker-compose — DEV (все сервисы с хот-релоадом)
#  Prod: docker-compose -f docker-compose.yml -f docker-compose.prod.yml
# ============================================================
name: price-portal

services:
  # ---------- База данных ----------
  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    container_name: pp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-price}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-price_secret}
      POSTGRES_DB: ${POSTGRES_DB:-price_portal}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${DEV_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-price} -d ${POSTGRES_DB:-price_portal}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [pp-net]

  # ---------- Кэш / брокер Celery ----------
  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    container_name: pp-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "${DEV_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [pp-net]

  # ---------- S3-хранилище (фото, PDF, экспорты) ----------
  # MinIO удалил свои образы с Docker Hub: в пространстве имён `minio` больше нет
  # репозиториев `minio` и `mc`, поэтому `docker compose up` падал на pull с
  # «pull access denied» на любой машине, включая чистый клон репозитория.
  # Замена — RustFS: S3-совместимый сервер, один бинарник. Проверен на boto3 из
  # apps/api (SigV4 + path-style addressing) — создание бакета, загрузка, чтение,
  # листинг. Прод на VPS использует нативный MinIO (docs/PROD-h215691.md) и этого
  # изменения не касается.
  # Все образы запинены по digest: при переезде на другую машину поднимется ровно
  # та же версия, а не «latest на момент запуска».
  rustfs:
    image: rustfs/rustfs@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    container_name: pp-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      RUSTFS_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - rustfs-data:/data
    ports:
      - "${DEV_S3_PORT:-9000}:9000"           # S3 API
      - "${DEV_S3_CONSOLE_PORT:-9001}:9001"   # Web Console
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [pp-net]

  # Разовое создание бакетов при первом старте. Раньше здесь был `minio/mc` с
  # `mc mb -p`; образа mc больше нет, поэтому используется aws-cli.
  s3init:
    image: amazon/aws-cli@sha256:95f8d1e6d31aaa16997d1406eb532b0ca6a9830fe8a859c37a0fd223f10959e5
    container_name: pp-s3-init
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-minioadmin}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
    entrypoint: >
      /bin/sh -c "
      set -e;
      A='--endpoint-url http://rustfs:9000';
      for b in $${S3_BUCKET_PHOTOS:-photos-series} $${S3_BUCKET_PDFS:-pdf-catalogs} $${S3_BUCKET_EXPORTS:-csv-exports} $${S3_BUCKET_TMP:-tmp-uploads} $${S3_BUCKET_ERRORS:-error-logs}; do
        aws $$A s3api head-bucket --bucket $$b >/dev/null 2>&1 || aws $$A s3api create-bucket --bucket $$b;
      done;
      echo 'бакеты S3 готовы';
      "
    networks: [pp-net]

  # ---------- FastAPI ----------
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      target: dev
    container_name: pp-api
    restart: unless-stopped
    env_file: ../.env
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../apps/api:/app            # хот-релоад
    ports:
      - "8000:8000"
    # --proxy-headers/--forwarded-allow-ips: реальный IP клиента из X-Forwarded-For
    # (ставит nginx), иначе пер-IP rate-limit'ы (login 5/15min) глобальные → DoS.
    # Вступает в силу при следующем пересоздании api (make up).
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      --proxy-headers --forwarded-allow-ips=172.16.0.0/12
    healthcheck:                # наследуется prod-overlay'ем (gunicorn на том же порту)
      test: ["CMD", "python", "-c", "import urllib.request as u,sys; sys.exit(0 if u.urlopen('http://localhost:8000/healthz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [pp-net]

  # ---------- Celery worker (импорт CSV, экспорты, уведомления) ----------
  worker:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      target: runtime
    container_name: pp-worker
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - ../apps/api:/app
    command: celery -A app.workers.celery_app worker -l info --concurrency=2
    networks: [pp-net]

  # ---------- Celery beat (расписание: курсы НБ РБ и др.) ----------
  beat:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      target: runtime
    container_name: pp-beat
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ../apps/api:/app
    command: celery -A app.workers.celery_app beat -l info
    networks: [pp-net]

  # ---------- Telegram-бот (уведомления менеджеру) ----------
  # Возвращён 2026-09-06: реализован реальный long-polling бот
  # (apps/api/app/bot/__main__.py: /start, /id, /help), crash-loop устранён.
  bot:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      target: runtime
    container_name: pp-bot
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - ../apps/api:/app
    command: python -m app.bot
    networks: [pp-net]

  # ---------- Nuxt 3 (frontend) ----------
  # PROD-режим по умолчанию: образ собирается через target=runtime
  # (npm ci + nuxt build → .output, запуск `node .output/server/index.mjs`).
  # Исходники НЕ монтируются — том затёр бы /app в образе.
  # Хот-релоад/dev-сервер: `make web-dev` (override infra/docker-compose.web-dev.yml),
  # обратно в prod: `make web-prod`. Dev-режим нужен для `make test-e2e`
  # (playwright живёт в dev-контейнере web).
  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      target: runtime
    container_name: pp-web
    restart: unless-stopped
    env_file: ../.env
    environment:
      NUXT_PUBLIC_API_BASE: ""
    depends_on:
      - api
    ports:
      - "3000:3000"
    healthcheck:                # node-fetch есть в runtime-образе (Node >=18)
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks: [pp-net]

  # ---------- Nginx (единый вход, reverse proxy) ----------
  nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: pp-nginx
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "${DEV_NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:                # /healthz отдаёт сам nginx статикой (200) — не зависит от api.
                                # 127.0.0.1, а не localhost: busybox wget резолвит localhost в ::1
                                # (IPv6), где nginx не слушает → вечный "connection refused".
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 10s
    networks: [pp-net]

  # ---------- Линтеры/форматтер фронта (make lint / make fmt) ----------
  # Отдельный сервис, потому что `web` собран с target: runtime: в нём нет ни
  # package.json, ни devDependencies — `docker compose exec web npm run lint`
  # падал с ENOENT. Здесь dev-образ + исходники; node_modules в именованном
  # томе, поэтому установка не переделывается на каждом прогоне.
  #
  # Второй шаг (`npm install --no-save`) обязателен: лок собран на macOS, и
  # `npm ci` на linux/arm64-musl не ставит optional-зависимости с нативными
  # биндингами (unrs-resolver → eslint падает с "Cannot find native binding",
  # это баг npm #4828). --no-save, чтобы не переписать package-lock.json
  # в примонтированном репозитории.
  #
  # Под профилем tools: `make up` его не поднимает, работает через `run --rm`.
  web-tools:
    profiles: ["tools"]
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ../apps/web:/app
      - web-tools-node-modules:/app/node_modules
    command: sh -c "npm ci --no-audit --no-fund && npm install --no-save --no-audit --no-fund && echo 'deps ready'"
    networks: [pp-net]

volumes:
  postgres-data:
  redis-data:
  rustfs-data:
  web-tools-node-modules:

networks:
  pp-net:
    driver: bridge
