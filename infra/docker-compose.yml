# ============================================================
#  docker-compose — DEV (все сервисы с хот-релоадом)
#  Prod: docker-compose -f docker-compose.yml -f docker-compose.prod.yml
# ============================================================
name: price-portal

services:
  # ---------- База данных ----------
  db:
    image: postgres:16-alpine
    container_name: pp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-price}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-price_secret}
      POSTGRES_DB: ${POSTGRES_DB:-price_portal}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${DEV_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-price} -d ${POSTGRES_DB:-price_portal}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [pp-net]

  # ---------- Кэш / брокер Celery ----------
  redis:
    image: redis:7-alpine
    container_name: pp-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "${DEV_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [pp-net]

  # ---------- S3-хранилище (фото, PDF, экспорты) ----------
  minio:
    image: minio/minio:latest
    container_name: pp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [pp-net]

  # Разовое создание бакетов при первом старте
  createbuckets:
    image: minio/mc:latest
    container_name: pp-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 2;
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin};
      mc mb -p local/${S3_BUCKET_PHOTOS:-photos-series} || true;
      mc mb -p local/${S3_BUCKET_PDFS:-pdf-catalogs}   || true;
      mc mb -p local/${S3_BUCKET_EXPORTS:-csv-exports} || true;
      mc mb -p local/${S3_BUCKET_TMP:-tmp-uploads}     || true;
      mc mb -p local/${S3_BUCKET_ERRORS:-error-logs}   || true;
      mc anonymous set download local/${S3_BUCKET_PHOTOS:-photos-series} || true;
      exit 0;
      "
    networks: [pp-net]

  # ---------- FastAPI ----------
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      target: dev
    container_name: pp-api
    restart: unless-stopped
    env_file: ../.env
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../apps/api:/app            # хот-релоад
    ports:
      - "8000:8000"
    # --proxy-headers/--forwarded-allow-ips: реальный IP клиента из X-Forwarded-For
    # (ставит nginx), иначе пер-IP rate-limit'ы (login 5/15min) глобальные → DoS.
    # Вступает в силу при следующем пересоздании api (make up).
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      --proxy-headers --forwarded-allow-ips=*
    healthcheck:                # наследуется prod-overlay'ем (gunicorn на том же порту)
      test: ["CMD", "python", "-c", "import urllib.request as u,sys; sys.exit(0 if u.urlopen('http://localhost:8000/healthz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [pp-net]

  # ---------- Celery worker (импорт CSV, экспорты, уведомления) ----------
  worker:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      target: runtime
    container_name: pp-worker
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - ../apps/api:/app
    command: celery -A app.workers.celery_app worker -l info --concurrency=2
    networks: [pp-net]

  # ---------- Celery beat (расписание: курсы НБ РБ и др.) ----------
  beat:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      target: runtime
    container_name: pp-beat
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ../apps/api:/app
    command: celery -A app.workers.celery_app beat -l info
    networks: [pp-net]

  # ---------- Telegram-бот (уведомления менеджеру) ----------
  # Возвращён 2026-09-06: реализован реальный long-polling бот
  # (apps/api/app/bot/__main__.py: /start, /id, /help), crash-loop устранён.
  bot:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      target: runtime
    container_name: pp-bot
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - ../apps/api:/app
    command: python -m app.bot
    networks: [pp-net]

  # ---------- Nuxt 3 (frontend) ----------
  # PROD-режим по умолчанию: образ собирается через target=runtime
  # (npm ci + nuxt build → .output, запуск `node .output/server/index.mjs`).
  # Исходники НЕ монтируются — том затёр бы /app в образе.
  # Хот-релоад/dev-сервер: `make web-dev` (override infra/docker-compose.web-dev.yml),
  # обратно в prod: `make web-prod`. Dev-режим нужен для `make test-e2e`
  # (playwright живёт в dev-контейнере web).
  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      target: runtime
    container_name: pp-web
    restart: unless-stopped
    env_file: ../.env
    environment:
      NUXT_PUBLIC_API_BASE: ""
    depends_on:
      - api
    ports:
      - "3000:3000"
    healthcheck:                # node-fetch есть в runtime-образе (Node >=18)
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks: [pp-net]

  # ---------- Nginx (единый вход, reverse proxy) ----------
  nginx:
    image: nginx:1.27-alpine
    container_name: pp-nginx
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "${DEV_NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:                # /healthz отдаёт сам nginx статикой (200) — не зависит от api.
                                # 127.0.0.1, а не localhost: busybox wget резолвит localhost в ::1
                                # (IPv6), где nginx не слушает → вечный "connection refused".
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 10s
    networks: [pp-net]

  # ---------- Линтеры/форматтер фронта (make lint / make fmt) ----------
  # Отдельный сервис, потому что `web` собран с target: runtime: в нём нет ни
  # package.json, ни devDependencies — `docker compose exec web npm run lint`
  # падал с ENOENT. Здесь dev-образ + исходники; node_modules в именованном
  # томе, поэтому установка не переделывается на каждом прогоне.
  #
  # Второй шаг (`npm install --no-save`) обязателен: лок собран на macOS, и
  # `npm ci` на linux/arm64-musl не ставит optional-зависимости с нативными
  # биндингами (unrs-resolver → eslint падает с "Cannot find native binding",
  # это баг npm #4828). --no-save, чтобы не переписать package-lock.json
  # в примонтированном репозитории.
  #
  # Под профилем tools: `make up` его не поднимает, работает через `run --rm`.
  web-tools:
    profiles: ["tools"]
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ../apps/web:/app
      - web-tools-node-modules:/app/node_modules
    command: sh -c "npm ci --no-audit --no-fund && npm install --no-save --no-audit --no-fund && echo 'deps ready'"
    networks: [pp-net]

volumes:
  postgres-data:
  redis-data:
  minio-data:
  web-tools-node-modules:

networks:
  pp-net:
    driver: bridge
